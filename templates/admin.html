<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Station Control — Satya Xerox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#09090B] text-zinc-100 min-h-screen flex flex-col justify-between antialiased p-4 sm:p-6 selection:bg-blue-600 selection:text-white">

    <div class="max-w-6xl mx-auto w-full space-y-6 flex-grow">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-zinc-800/80">
            <div class="flex items-center gap-3">
                <img id="adminLogo" src="/static/logo.png" onerror="this.src='https://api.dicebear.com/7.x/shapes/svg?seed=satya'" class="h-11 w-11 rounded-2xl object-contain border border-zinc-800 bg-zinc-900 p-1 shadow-sm">
                <div>
                    <h1 class="text-lg font-bold text-white leading-tight">Admin Station Control</h1>
                    <p class="text-xs text-zinc-400">Configure size rates, custom grid surcharge & verify jobs</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-3.5 py-1.5 bg-zinc-900 border border-zinc-800 rounded-full text-xs shadow-sm">
                <span id="statusDot" class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusLabel" class="text-zinc-300 font-medium">Checking Canon G3010...</span>
            </div>
        </header>

        <!-- Direct Hardware Testing Action Bar -->
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Hardware Test Actions (Port 631)</h3>
                <p class="text-xs text-zinc-400 mt-0.5">Diagnose paper rollers and nozzle firing directly</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button type="button" id="btnTestBlank" onclick="runDiagnostic('blank')" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-zinc-200 transition flex items-center justify-center gap-2 shadow-sm">
                    <span>📄</span>
                    <span>Print Blank Page Test</span>
                </button>
                <button type="button" id="btnTestImage" onclick="runDiagnostic('image')" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl border border-blue-600/80 bg-blue-600/20 hover:bg-blue-600/30 text-xs font-bold text-blue-400 transition flex items-center justify-center gap-2 shadow-sm">
                    <span>🎨</span>
                    <span>Print Image Test</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section class="lg:col-span-5 space-y-5">
                <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">Store Profile & Network</h2>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">UPI VPA</label>
                            <input type="text" id="upiIdInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Canon G3010 Local IP Address</label>
                            <input type="text" id="printerIpInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <button id="saveConfigBtn" class="w-full py-3 bg-[#2563EB] hover:bg-blue-600 font-bold text-xs text-white rounded-xl shadow-lg shadow-blue-600/20 transition">
                    Save All Configurations
                </button>
            </section>

            <section class="lg:col-span-7 space-y-4">
                <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
                        <h2 class="text-sm font-bold text-white">Payment & Print Queue</h2>
                        <button onclick="loadJobs()" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg font-semibold text-zinc-200 transition">
                            Refresh
                        </button>
                    </div>
                    <div id="jobsContainer" class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                        <p class="text-xs text-zinc-500 text-center py-12">No orders in queue.</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <footer class="py-5 border-t border-zinc-900 bg-[#000000] text-center">
        <p class="text-xs font-semibold text-zinc-400 tracking-wide">Created & Designed by <span class="text-blue-500 font-extrabold uppercase">PIYUSH</span></p>
    </footer>

    <script>
        async function fetchSettings() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                document.getElementById('upiIdInput').value = data.upi_id || '';
                document.getElementById('printerIpInput').value = data.printer_ip || '';
            } catch(e) {}
        }

        async function pollPrinter() {
            try {
                const res = await fetch('/api/printer/status');
                const data = await res.json();
                const isOnline = data.status === 'Online';
                document.getElementById('statusDot').className = `h-2 w-2 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-500'}`;
                document.getElementById('statusLabel').textContent = `Printer: ${data.status} (${data.ip}:631)`;
            } catch {
                document.getElementById('statusLabel').textContent = 'Server Offline';
            }
        }

        async function runDiagnostic(type) {
            const btn = type === 'blank' ? document.getElementById('btnTestBlank') : document.getElementById('btnTestImage');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<span>⏳</span><span>Sending...</span>`;
            btn.disabled = true;

            try {
                const res = await fetch(`/api/admin/test/${type}`, { method: 'POST' });
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    data = { error: text.slice(0, 150) };
                }

                if (res.ok && data.success) {
                    alert(`✅ ${data.message}`);
                } else {
                    alert(`❌ Printer Error: ${data.error || 'Connection rejected by Canon firmware.'}`);
                }
            } catch (err) {
                alert(`❌ Network Failure: ${err.message}`);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                pollPrinter();
            }
        }

        document.getElementById('saveConfigBtn').addEventListener('click', async () => {
            const payload = {
                upi_id: document.getElementById('upiIdInput').value,
                printer_ip: document.getElementById('printerIpInput').value
            };
            await fetch('/api/admin/config/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            alert('Settings saved!');
            pollPrinter();
        });

        async function loadJobs() {
            const res = await fetch('/api/jobs');
            const jobs = await res.json();
            const container = document.getElementById('jobsContainer');

            if (jobs.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-12">No orders in queue.</p>';
                return;
            }

            container.innerHTML = jobs.slice().reverse().map(j => `
                <div class="p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <img src="/uploads/${j.primary_file}" class="h-12 w-12 rounded-lg object-cover border border-zinc-800">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-white">#${j.id}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${j.payment_status === 'Paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${j.payment_status}</span>
                            </div>
                            <p class="text-[11px] text-zinc-500 mt-0.5">${j.time} • ${j.copies}x</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-3">
                        <span class="text-sm font-extrabold text-white">₹${j.total_price.toFixed(2)}</span>
                        ${j.print_status !== 'Completed' ? `
                            <button onclick="approve(${j.id})" class="px-3.5 py-1.5 text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl shadow-sm transition">
                                Verify & Print
                            </button>
                        ` : `<span class="text-xs text-zinc-500 font-medium px-2 py-1">Printed</span>`}
                    </div>
                </div>
            `).join('');
        }

        async function approve(id) {
            const res = await fetch(`/api/jobs/verify_and_print/${id}`, { method: 'POST' });
            const data = await res.json();
            if (!res.ok || !data.success) alert(`❌ Print failed: ${data.error}`);
            loadJobs();
        }

        fetchSettings();
        pollPrinter();
        loadJobs();
        setInterval(loadJobs, 3500);
    </script>
</body>
</html>
