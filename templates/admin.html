<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Station Control — Canon G3010</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased p-4 sm:p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header & Hardware Monitor -->
        <header class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-black text-xl border border-cyan-500/30">
                    ⌘
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight">Print Station Command</h1>
                    <p class="text-xs text-slate-400">Payment Settlements & Hardware Authorization</p>
                </div>
            </div>

            <!-- Detailed Printer Health Pills -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="px-3.5 py-1.5 rounded-full bg-slate-800 border border-slate-700 flex items-center gap-2">
                    <span id="dot9100" class="h-2 w-2 rounded-full bg-slate-500"></span>
                    <span class="text-slate-300">RAW: 9100</span>
                </div>
                <div class="px-3.5 py-1.5 rounded-full bg-slate-800 border border-slate-700 flex items-center gap-2">
                    <span id="dot631" class="h-2 w-2 rounded-full bg-slate-500"></span>
                    <span class="text-slate-300">IPP: 631</span>
                </div>
                <div class="px-4 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 font-bold flex items-center gap-2" id="overallBadge">
                    <span id="mainDot" class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="printerStatusText" class="text-slate-300">Polling G3010...</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left: Settings & Configuration -->
            <aside class="lg:col-span-4 space-y-6">
                
                <!-- Payment & Hardware Parameters -->
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400">Core Network & UPI</h2>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1 font-semibold">Canon G3010 IP Address</label>
                            <input type="text" id="printerIpInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white font-mono outline-none focus:border-cyan-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-semibold">UPI ID (VPA)</label>
                            <input type="text" id="upiIdInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-cyan-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-semibold">Business / Payee Name</label>
                            <input type="text" id="payeeNameInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white outline-none focus:border-cyan-500">
                        </div>
                    </div>
                </div>

                <!-- Live Price Configuration -->
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400">Rate Card (₹)</h2>
                    
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1">Plain B&W</label>
                            <input type="number" id="ratePlainBw" step="0.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Plain Color</label>
                            <input type="number" id="ratePlainColor" step="0.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Photo Glossy</label>
                            <input type="number" id="rateGlossy" step="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Photo Matte</label>
                            <input type="number" id="rateMatte" step="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-white outline-none">
                        </div>
                    </div>

                    <button id="saveConfigBtn" class="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 font-bold text-xs text-white rounded-xl shadow-lg transition">
                        Update Settings
                    </button>
                </div>

            </aside>

            <!-- Right: Order Queue & History -->
            <main class="lg:col-span-8 space-y-6">
                
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-800">
                        <div>
                            <h2 class="text-base font-bold text-white tracking-tight">Queue & Payment Verification</h2>
                            <p class="text-xs text-emerald-400 font-semibold mt-0.5" id="totalRev">Settled Revenue: ₹0.00</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span id="queueBadge" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 font-semibold">0 Orders</span>
                            <button onclick="loadJobs()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-xl text-slate-200 transition">
                                Refresh
                            </button>
                        </div>
                    </div>

                    <div id="jobsList" class="space-y-3 max-h-[640px] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-500 text-center py-12">No orders placed yet.</p>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <script>
        async function fetchSettings() {
            const res = await fetch('/api/config');
            const d = await res.json();
            document.getElementById('printerIpInput').value = d.printer_ip || '';
            document.getElementById('upiIdInput').value = d.upi_id || '';
            document.getElementById('payeeNameInput').value = d.payee_name || '';

            if (d.rates) {
                document.getElementById('ratePlainBw').value = d.rates.plain_bw;
                document.getElementById('ratePlainColor').value = d.rates.plain_color;
                document.getElementById('rateGlossy').value = d.rates.photo_glossy;
                document.getElementById('rateMatte').value = d.rates.photo_matte;
            }
        }

        async function pollPrinterStatus() {
            try {
                const res = await fetch('/api/printer/status');
                const d = await res.json();
                
                document.getElementById('dot9100').className = `h-2 w-2 rounded-full ${d.raw_port_9100 ? 'bg-emerald-400' : 'bg-rose-500'}`;
                document.getElementById('dot631').className = `h-2 w-2 rounded-full ${d.ipp_port_631 ? 'bg-emerald-400' : 'bg-rose-500'}`;
                
                const isOnline = d.raw_port_9100 || d.ipp_port_631;
                document.getElementById('mainDot').className = `h-2 w-2 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-500'}`;
                document.getElementById('printerStatusText').textContent = `Canon: ${d.status} (${d.ip})`;
            } catch {
                document.getElementById('printerStatusText').textContent = 'Server Unreachable';
            }
        }

        document.getElementById('saveConfigBtn').addEventListener('click', async () => {
            const payload = {
                printer_ip: document.getElementById('printerIpInput').value,
                upi_id: document.getElementById('upiIdInput').value,
                payee_name: document.getElementById('payeeNameInput').value,
                rates: {
                    plain_bw: parseFloat(document.getElementById('ratePlainBw').value),
                    plain_color: parseFloat(document.getElementById('ratePlainColor').value),
                    photo_glossy: parseFloat(document.getElementById('rateGlossy').value),
                    photo_matte: parseFloat(document.getElementById('rateMatte').value)
                }
            };
            await fetch('/api/admin/config/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert('Settings updated successfully!');
            pollPrinterStatus();
        });

        async function loadJobs() {
            const res = await fetch('/api/jobs');
            const jobs = await res.json();
            const list = document.getElementById('jobsList');
            document.getElementById('queueBadge').textContent = `${jobs.length} Orders`;

            let rev = 0;
            jobs.forEach(j => { if (j.payment_status === 'Paid') rev += j.total_price; });
            document.getElementById('totalRev').textContent = `Settled Revenue: ₹${rev.toFixed(2)}`;

            if (jobs.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 text-center py-12">No orders placed yet.</p>';
                return;
            }

            list.innerHTML = jobs.slice().reverse().map(j => `
                <div class="p-4 bg-slate-800/40 border border-slate-700/60 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="flex items-center gap-3">
                        <a href="/uploads/${j.filename}" target="_blank">
                            <img src="/uploads/${j.filename}" class="w-14 h-14 object-cover rounded-xl border border-slate-600 hover:opacity-80 transition">
                        </a>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-white">#${j.id}</span>
                                <span class="text-xs font-semibold text-slate-300 truncate max-w-[130px] sm:max-w-[200px]">${j.original_name}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${j.payment_status === 'Paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${j.payment_status}</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-1">
                                ${j.copies}x • ${j.color_mode} • ${j.paper_size} • ${j.media_type} (${j.border})
                            </p>
                            <p class="text-[10px] text-slate-500 mt-0.5">${j.time}</p>
                            ${j.error_log ? `<p class="text-[10px] text-rose-400 mt-1 truncate max-w-[240px]">${j.error_log}</p>` : ''}
                        </div>
                    </div>

                    <div class="flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto gap-2">
                        <span class="text-sm font-extrabold text-white">₹${j.total_price.toFixed(2)}</span>
                        ${j.print_status !== 'Completed' ? `
                            <button onclick="approveJob(${j.id})" class="px-3.5 py-2 text-xs font-bold bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl shadow-lg transition">
                                Verify & Print
                            </button>
                        ` : `
                            <span class="text-xs text-emerald-400 font-bold px-2.5 py-1 bg-emerald-500/10 rounded-lg border border-emerald-500/20">Printed ✓</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function approveJob(id) {
            const btn = event.target;
            btn.textContent = 'Dispatching...';
            btn.disabled = true;
            const res = await fetch(`/api/jobs/verify_and_print/${id}`, { method: 'POST' });
            const data = await res.json();
            if (!res.ok) alert(`Print Error: ${data.error || 'Failed to dispatch to printer'}`);
            loadJobs();
        }

        fetchSettings();
        pollPrinterStatus();
        loadJobs();
        setInterval(loadJobs, 4000);
        setInterval(pollPrinterStatus, 15000);
    </script>
</body>
</html>
