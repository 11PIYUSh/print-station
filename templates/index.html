<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Photo & Document Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-1">
            <span class="inline-flex p-2.5 bg-blue-600/20 text-blue-400 rounded-2xl text-xl">🖨️</span>
            <h1 class="text-xl font-bold text-white tracking-tight">Express Print Counter</h1>
            <p class="text-xs text-slate-400">Upload or scan photo, configure details & settle payment</p>
        </div>

        <form id="customerForm" class="space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-800/40 rounded-2xl cursor-pointer transition">
                    <span class="text-lg">📁</span>
                    <span class="text-xs font-semibold text-slate-300 mt-1">Gallery Image</span>
                    <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" class="hidden">
                </label>
                <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-800/40 rounded-2xl cursor-pointer transition">
                    <span class="text-lg">📷</span>
                    <span class="text-xs font-semibold text-slate-300 mt-1">Scan Document</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                </label>
            </div>

            <div id="previewCard" class="hidden p-3 bg-slate-800/80 rounded-xl border border-slate-700 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img id="previewImg" class="h-10 w-10 rounded-lg object-cover border border-slate-600">
                    <span id="fileName" class="text-xs font-medium text-slate-200 truncate max-w-[170px]"></span>
                </div>
                <button type="button" id="removeFile" class="text-xs font-semibold text-rose-400 hover:text-rose-300">Remove</button>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Color Mode</label>
                    <select id="colorMode" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
                        <option value="color">Full Color</option>
                        <option value="bw">Black & White</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Paper Size</label>
                    <select id="paperSize" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
                        <option value="A4">A4 Sheet</option>
                        <option value="4x6">Photo 4x6</option>
                        <option value="5x7">Photo 5x7</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Copies</label>
                    <input type="number" id="copies" min="1" max="50" value="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none">
                </div>
            </div>

            <!-- Dynamic Pricing & Settlement Box -->
            <div class="bg-gradient-to-b from-slate-800/50 to-slate-800/90 border border-slate-700/80 rounded-2xl p-4 space-y-3 text-center">
                <div class="flex items-center justify-between px-2 text-xs">
                    <span class="text-slate-400 font-medium">Estimated Bill:</span>
                    <span id="priceDisplay" class="text-base font-bold text-emerald-400">₹0.00</span>
                </div>
                <div id="qrWrapper" class="inline-block p-3 bg-white rounded-2xl shadow-xl">
                    <div id="qrcode" class="flex items-center justify-center"></div>
                </div>
                <p id="upiNotice" class="text-[11px] text-slate-400">Scan via Google Pay, PhonePe, or Paytm</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white rounded-xl shadow-lg transition duration-150">
                Confirm & Send to Print Queue
            </button>
        </form>
    </div>

    <script>
        let selectedFile = null;
        let config = {};
        const qrcodeContainer = document.getElementById('qrcode');
        let qrCodeInstance = null;

        async function init() {
            const res = await fetch('/api/config');
            config = await res.json();
            recalc();
        }

        function recalc() {
            if (!config.rates) return;
            const size = document.getElementById('paperSize').value;
            const mode = document.getElementById('colorMode').value;
            const copies = parseInt(document.getElementById('copies').value) || 1;

            let rate = config.rates.bw_a4;
            if (size === '4x6') rate = config.rates.photo_4x6;
            else if (size === '5x7') rate = config.rates.photo_5x7;
            else if (mode === 'color') rate = config.rates.color_a4;

            const total = (rate * copies).toFixed(2);
            document.getElementById('priceDisplay').textContent = `₹${total}`;

            // Generate UPI Intent Link
            const upiString = `upi://pay?pa=${config.upi_id}&pn=${encodeURIComponent(config.payee_name)}&am=${total}&cu=INR`;             qrcodeContainer.innerHTML = '';             qrCodeInstance = new QRCode(qrcodeContainer, {                 text: upiString,                 width: 120,                 height: 120             });         }          ['colorMode', 'paperSize', 'copies'].forEach(id => {             document.getElementById(id).addEventListener('change', recalc);             document.getElementById(id).addEventListener('input', recalc);         });          function handleFile(file) {             if (!file) return;             selectedFile = file;             document.getElementById('fileName').textContent = file.name;             const reader = new FileReader();             reader.onload = e => {                 document.getElementById('previewImg').src = e.target.result;                 document.getElementById('previewCard').classList.remove('hidden');             };             reader.readAsDataURL(file);         }          document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));         document.getElementById('cameraInput').addEventListener('change', e => handleFile(e.target.files[0]));         document.getElementById('removeFile').addEventListener('click', () => {             selectedFile = null;             document.getElementById('fileInput').value = '';             document.getElementById('cameraInput').value = '';             document.getElementById('previewCard').classList.add('hidden');         });          document.getElementById('customerForm').addEventListener('submit', async e => {             e.preventDefault();             if (!selectedFile) return alert('Select or scan an image first');              const fd = new FormData();             fd.append('file', selectedFile);             fd.append('color_mode', document.getElementById('colorMode').value);             fd.append('paper_size', document.getElementById('paperSize').value);             fd.append('copies', document.getElementById('copies').value);              const res = await fetch('/upload', { method: 'POST', body: fd });             const data = await res.json();             if (res.ok) {                 alert(`Order #${data.job.id} registered! Verify payment with the shopkeeper.`);
                document.getElementById('removeFile').click();
            } else {
                alert(data.error || 'Upload error');
            }
        });

        init();
    </script>
</body>
</html>
