<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Print Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased p-4 sm:p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Station Control Panel</h1>
                <p class="text-xs text-slate-400 mt-1">Manage rates, UPI configurations, and print authorizations</p>
            </div>
            <div id="printerBadge" class="flex items-center gap-2.5 px-4 py-1.5 bg-slate-900 border border-slate-800 rounded-full text-xs">
                <span id="statusDot" class="h-2.5 w-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusLabel" class="text-slate-300 font-medium">Checking Canon G3010...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Side: System Settings -->
            <section class="lg:col-span-5 space-y-6">
                
                <!-- UPI & Store Settings -->
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-cyan-400">Payment & Hardware Setup</h2>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1">UPI ID (VPA)</label>
                            <input type="text" id="upiIdInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none focus:ring-1 focus:ring-cyan-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Payee Name</label>
                            <input type="text" id="payeeNameInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none focus:ring-1 focus:ring-cyan-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Canon G3010 IP Address</label>
                            <input type="text" id="printerIpInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none focus:ring-1 focus:ring-cyan-500">
                        </div>
                    </div>
                </div>

                <!-- Price Configuration -->
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-cyan-400">Pricing Matrix (₹)</h2>
                    
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-400 mb-1">A4 B&W (₹)</label>
                            <input type="number" id="bwA4Rate" step="0.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">A4 Color (₹)</label>
                            <input type="number" id="colorA4Rate" step="0.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Photo 4x6 (₹)</label>
                            <input type="number" id="photo4x6Rate" step="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">Photo 5x7 (₹)</label>
                            <input type="number" id="photo5x7Rate" step="1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 outline-none">
                        </div>
                    </div>

                    <button id="saveConfigBtn" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-bold text-xs text-white rounded-xl transition">
                        Save Configurations
                    </button>
                </div>

            </section>

            <!-- Right Side: Order Verification & History -->
            <section class="lg:col-span-7 space-y-6">
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                        <div>
                            <h2 class="text-base font-bold text-white tracking-tight">Payment & Print History</h2>
                            <p class="text-xs text-slate-400" id="revenueMetric">Total Billed: ₹0.00</p>
                        </div>
                        <button onclick="loadJobs()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 font-semibold">
                            Refresh
                        </button>
                    </div>

                    <div id="jobsList" class="space-y-3 max-h-[580px] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-500 text-center py-10">No orders recorded yet.</p>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script>
        async function fetchSettings() {
            const res = await fetch('/api/config');
            const data = await res.json();
            document.getElementById('upiIdInput').value = data.upi_id || '';
            document.getElementById('payeeNameInput').value = data.payee_name || '';
            document.getElementById('printerIpInput').value = data.printer_ip || '';

            if (data.rates) {
                document.getElementById('bwA4Rate').value = data.rates.bw_a4;
                document.getElementById('colorA4Rate').value = data.rates.color_a4;
                document.getElementById('photo4x6Rate').value = data.rates.photo_4x6;
                document.getElementById('photo5x7Rate').value = data.rates.photo_5x7;
            }
        }

        async function pollPrinter() {
            try {
                const res = await fetch('/api/printer/status');
                const data = await res.json();
                const isOnline = data.status === 'Online';
                document.getElementById('statusDot').className = `h-2.5 w-2.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-500'}`;
                document.getElementById('statusLabel').textContent = `Printer: ${data.status} (${data.ip})`;
            } catch {
                document.getElementById('statusLabel').textContent = 'Server Disconnected';
            }
        }

        document.getElementById('saveConfigBtn').addEventListener('click', async () => {
            const payload = {
                upi_id: document.getElementById('upiIdInput').value,
                payee_name: document.getElementById('payeeNameInput').value,
                printer_ip: document.getElementById('printerIpInput').value,
                rates: {
                    bw_a4: parseFloat(document.getElementById('bwA4Rate').value),
                    color_a4: parseFloat(document.getElementById('colorA4Rate').value),
                    photo_4x6: parseFloat(document.getElementById('photo4x6Rate').value),
                    photo_5x7: parseFloat(document.getElementById('photo5x7Rate').value)
                }
            };
            const res = await fetch('/api/admin/config/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) alert('Settings saved successfully!');
            pollPrinter();
        });

        async function loadJobs() {
            const res = await fetch('/api/jobs');
            const jobs = await res.json();
            const container = document.getElementById('jobsList');

            let totalRev = 0;
            jobs.forEach(j => {
                if (j.payment_status === 'Paid') totalRev += j.total_price;
            });
            document.getElementById('revenueMetric').textContent = `Total Settled Revenue: ₹${totalRev.toFixed(2)}`;

            if (jobs.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-10">No orders recorded yet.</p>';
                return;
            }

            container.innerHTML = jobs.slice().reverse().map(j => `
                <div class="p-3.5 bg-slate-800/40 border border-slate-700/60 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-200">#${j.id}</span>
                            <span class="text-xs font-semibold text-slate-300 truncate max-w-[150px]">${j.original_name}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${j.payment_status === 'Paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${j.payment_status}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-1">${j.time} •${j.copies} copy • ${j.color_mode} •${j.paper_size}</p>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-3">
                        <span class="text-sm font-bold text-white">₹${j.total_price.toFixed(2)}</span>${j.print_status !== 'Printed' ? `
                            <button onclick="approve(${j.id})" class="px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition shadow">
                                Confirm & Print
                            </button>
                        ` : `
                            <span class="text-xs text-slate-500 font-medium px-2 py-1">Completed</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function approve(id) {
            const res = await fetch(`/api/jobs/verify_and_print/${id}`, { method: 'POST' });
            const data = await res.json();
            if (!res.ok) alert(data.error || 'Print failed');
            loadJobs();
        }

        fetchSettings();
        pollPrinter();
        loadJobs();
        setInterval(loadJobs, 4000);
        setInterval(pollPrinter, 15000);
    </script>
</body>
</html>
