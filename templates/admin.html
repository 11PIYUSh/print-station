<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Station — Satya Xerox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#09090B] text-zinc-100 min-h-screen flex flex-col justify-between antialiased p-4 sm:p-6 selection:bg-blue-600 selection:text-white">

    <div class="max-w-6xl mx-auto w-full space-y-6 flex-grow">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-zinc-800/80">
            <div class="flex items-center gap-3">
                <img id="adminLogo" src="/static/logo.png" onerror="this.src='https://api.dicebear.com/7.x/shapes/svg?seed=satya'" class="h-11 w-11 rounded-2xl object-contain border border-zinc-800 bg-zinc-900 p-1 shadow-sm">
                <div>
                    <h1 class="text-lg font-bold text-white leading-tight">Admin Station Control</h1>
                    <p class="text-xs text-zinc-400">Configure rates, UPI credentials, and authorize prints</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-3.5 py-1.5 bg-zinc-900 border border-zinc-800 rounded-full text-xs shadow-sm">
                <span id="statusDot" class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="statusLabel" class="text-zinc-300 font-medium">Checking Canon G3010...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Controls: Rates & Setup -->
            <section class="lg:col-span-5 space-y-5">
                
                <!-- Branding & Logo -->
                <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">Portal Branding</h2>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Store Name</label>
                            <input type="text" id="shopNameInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Tagline / Subheading</label>
                            <input type="text" id="taglineInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Upload Store Logo</label>
                            <input type="file" id="logoInput" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- UPI & Hardware -->
                <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">UPI & Canon IP</h2>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">UPI VPA</label>
                            <input type="text" id="upiIdInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">UPI Payee Name</label>
                            <input type="text" id="payeeNameInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Canon G3010 Local IP Address</label>
                            <input type="text" id="printerIpInput" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-white outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Rate Configuration -->
                <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400">Rate Banner Setup (₹/page)</h2>
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">B&W Single (₹)</label>
                            <input type="number" id="bwSingleInput" step="0.5" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Color Single (₹)</label>
                            <input type="number" id="colorSingleInput" step="0.5" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">B&W Double (₹)</label>
                            <input type="number" id="bwDoubleInput" step="0.5" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-zinc-400 mb-1 font-medium">Color Double (₹)</label>
                            <input type="number" id="colorDoubleInput" step="0.1" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-white outline-none">
                        </div>
                    </div>

                    <button id="saveConfigBtn" class="w-full py-2.5 bg-[#2563EB] hover:bg-blue-600 font-bold text-xs text-white rounded-xl shadow-lg shadow-blue-600/20 transition">
                        Save Configurations
                    </button>
                </div>

            </section>

            <!-- Right Queue: Live Authorization -->
            <section class="lg:col-span-7 space-y-4">
                <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 shadow-xl space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
                        <div>
                            <h2 class="text-sm font-bold text-white">Payment & Print Queue</h2>
                            <p class="text-xs text-zinc-400" id="totalRevDisplay">Total Settled: ₹0.00</p>
                        </div>
                        <button onclick="loadJobs()" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg font-semibold text-zinc-200 transition">
                            Refresh
                        </button>
                    </div>

                    <div id="jobsContainer" class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                        <p class="text-xs text-zinc-500 text-center py-12">No orders in queue.</p>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- Persistent Footer -->
    <footer class="py-5 border-t border-zinc-900 bg-[#000000] text-center space-y-1 mt-6">
        <p class="text-xs font-semibold text-zinc-400 tracking-wide">Created & Designed by <span class="text-blue-500 font-extrabold uppercase">PIYUSH</span></p>
        <p class="text-[10px] text-zinc-600">ApnaPrinter Cloud Integration Hub</p>
    </footer>

    <script>
        async function fetchSettings() {
            const res = await fetch('/api/config');
            const data = await res.json();
            
            document.getElementById('shopNameInput').value = data.shop_name || '';
            document.getElementById('taglineInput').value = data.tagline || '';
            document.getElementById('upiIdInput').value = data.upi_id || '';
            document.getElementById('payeeNameInput').value = data.payee_name || '';
            document.getElementById('printerIpInput').value = data.printer_ip || '';

            if (data.logo_url) document.getElementById('adminLogo').src = data.logo_url;

            if (data.rates) {
                document.getElementById('bwSingleInput').value = data.rates.bw_single;
                document.getElementById('colorSingleInput').value = data.rates.color_single;
                document.getElementById('bwDoubleInput').value = data.rates.bw_double;
                document.getElementById('colorDoubleInput').value = data.rates.color_double;
            }
        }

        async function pollPrinter() {
            try {
                const res = await fetch('/api/printer/status');
                const data = await res.json();
                const isOnline = data.status === 'Online';
                document.getElementById('statusDot').className = `h-2 w-2 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-500'}`;
                document.getElementById('statusLabel').textContent = `Printer: ${data.status} (${data.ip})`;
            } catch {
                document.getElementById('statusLabel').textContent = 'Server Offline';
            }
        }

        document.getElementById('logoInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('logo', file);
            const res = await fetch('/api/admin/logo/upload', { method: 'POST', body: fd });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('adminLogo').src = data.logo_url;
                alert('Store logo updated!');
            }
        });

        document.getElementById('saveConfigBtn').addEventListener('click', async () => {
            const payload = {
                shop_name: document.getElementById('shopNameInput').value,
                tagline: document.getElementById('taglineInput').value,
                upi_id: document.getElementById('upiIdInput').value,
                payee_name: document.getElementById('payeeNameInput').value,
                printer_ip: document.getElementById('printerIpInput').value,
                rates: {
                    bw_single: parseFloat(document.getElementById('bwSingleInput').value),
                    color_single: parseFloat(document.getElementById('colorSingleInput').value),
                    bw_double: parseFloat(document.getElementById('bwDoubleInput').value),
                    color_double: parseFloat(document.getElementById('colorDoubleInput').value)
                }
            };
            const res = await fetch('/api/admin/config/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) alert('Settings saved successfully!');
            pollPrinter();
        });

        async function loadJobs() {
            const res = await fetch('/api/jobs');
            const jobs = await res.json();
            const container = document.getElementById('jobsContainer');

            let totalRev = 0;
            jobs.forEach(j => {
                if (j.payment_status === 'Paid') totalRev += j.total_price;
            });
            document.getElementById('totalRevDisplay').textContent = `Total Settled: ₹${totalRev.toFixed(2)}`;

            if (jobs.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-12">No orders in queue.</p>';
                return;
            }

            container.innerHTML = jobs.slice().reverse().map(j => `
                <div class="p-3.5 bg-zinc-950 border border-zinc-800 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <img src="/uploads/${j.filename}" class="h-12 w-12 rounded-lg object-cover border border-zinc-800">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-white">#${j.id}</span>
                                <span class="text-xs font-medium text-zinc-300 truncate max-w-[130px]">${j.original_name}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${j.payment_status === 'Paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${j.payment_status}</span>
                            </div>
                            <p class="text-[11px] text-zinc-500 mt-0.5">${j.time} • ${j.copies}x • ${j.color_mode.toUpperCase()} • Side: ${j.print_side || 'single'}</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-3">
                        <span class="text-sm font-extrabold text-white">₹${j.total_price.toFixed(2)}</span>
                        ${j.print_status !== 'Completed' ? `
                            <button onclick="approve(${j.id})" class="px-3.5 py-1.5 text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl shadow-sm transition">
                                Verify & Print
                            </button>
                        ` : `
                            <span class="text-xs text-zinc-500 font-medium px-2 py-1">Printed</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function approve(id) {
            const res = await fetch(`/api/jobs/verify_and_print/${id}`, { method: 'POST' });
            const data = await res.json();
            if (!res.ok) alert(data.error || 'Print failed');
            loadJobs();
        }

        fetchSettings();
        pollPrinter();
        loadJobs();
        setInterval(loadJobs, 3500);
        setInterval(pollPrinter, 15000);
    </script>
</body>
</html>
